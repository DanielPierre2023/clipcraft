<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipCraft — AI Cinema Engine</title>
  
  <!-- Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#050507',
              panel: '#09090d',
              border: 'rgba(255, 255, 255, 0.08)',
              accent: '#8b5cf6',
            }
          }
        }
      }
    }
  </script>

  <!-- React & Babel for Browser Executable UI -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Custom Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #050507; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
  </style>
</head>
<body class="bg-[#050507] text-zinc-100 antialiased overflow-hidden select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ASSET_GALLERY = [
      {
        id: 1,
        title: 'Neon Horizon — Shot 01',
        duration: '00:05',
        ratio: '16:9',
        img: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1200&auto=format&fit=crop',
        tag: 'Drone Motion'
      },
      {
        id: 2,
        title: 'Misty Alpine Ridge',
        duration: '00:04',
        ratio: '21:9',
        img: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1200&auto=format&fit=crop',
        tag: 'Pan Left'
      },
      {
        id: 3,
        title: 'Cyberpunk Intersection',
        duration: '00:08',
        ratio: '16:9',
        img: 'https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200&auto=format&fit=crop',
        tag: 'Zoom Push'
      },
      {
        id: 4,
        title: 'Monolith Fluid Sculpture',
        duration: '00:05',
        ratio: '16:9',
        img: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200&auto=format&fit=crop',
        tag: 'Macro 85mm'
      }
    ];

    function StudioApp() {
      const [prompt, setPrompt] = useState('A cinematic drone sweep across damp atmospheric mountain peaks at twilight, dramatic raytracing lighting, anamorphic optics.');
      const [style, setStyle] = useState('cinematic');
      const [duration, setDuration] = useState('5');
      const [resolution, setResolution] = useState('1280x720');
      const [lens, setLens] = useState('35mm Anamorphic');
      const [lighting, setLighting] = useState('Volumetric Fog & Cyan Glow');
      const [velocity, setVelocity] = useState(65);
      
      const [activeShot, setActiveShot] = useState(ASSET_GALLERY[0]);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isRendering, setIsRendering] = useState(false);
      const [progress, setProgress] = useState(0);
      const [stage, setStage] = useState('');
      const [renderResult, setRenderResult] = useState(null);
      const [error, setError] = useState(null);

      // Start Video Generation Workflow
      async function handleRender() {
        if (!prompt.trim()) return;

        setIsRendering(true);
        setProgress(0);
        setStage('Initializing Camera Rig...');
        setRenderResult(null);
        setError(null);

        try {
          const response = await fetch('/api/generate', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-API-Key': 'demo'
            },
            body: JSON.stringify({
              prompt: `${prompt} | Lens: ${lens}, Lighting: ${lighting}`,
              style,
              duration: parseInt(duration),
              resolution
            })
          });

          if (!response.ok) {
            let errorMsg = 'Failed to submit generation task';
            try {
              const errData = await response.json();
              errorMsg = errData.detail || errorMsg;
            } catch (jsonErr) {
              const rawText = await response.text();
              errorMsg = rawText || `Server Error (${response.status})`;
            }
            throw new Error(errorMsg);
          }

          const data = await response.json();
          pollJobStatus(data.job_id);
        } catch (e) {
          setError(e.message);
          setIsRendering(false);
        }
      }

      // Poll Status
      function pollJobStatus(jobId) {
        const interval = setInterval(async () => {
          try {
            const res = await fetch(`/api/jobs/${jobId}`, {
              headers: { 'X-API-Key': 'demo' }
            });

            if (!res.ok) {
              let errText = 'Status polling failed';
              try {
                const errJson = await res.json();
                errText = errJson.detail || errText;
              } catch (e) {
                errText = await res.text();
              }
              throw new Error(errText);
            }

            const statusData = await res.json();
            setProgress(statusData.progress || 0);
            setStage(statusData.stage || 'Rendering frames...');

            if (statusData.status === 'completed') {
              clearInterval(interval);
              setIsRendering(false);
              setRenderResult(statusData.result_url);
            } else if (statusData.status === 'failed') {
              clearInterval(interval);
              setIsRendering(false);
              setError(statusData.error || 'Rendering engine error');
            }
          } catch (e) {
            clearInterval(interval);
            setIsRendering(false);
            setError(e.message || 'Connection lost during render');
          }
        }, 1200);
      }

      return (
        <div className="flex h-screen w-full bg-[#050507] text-zinc-100">
          
          {/* LEFT SIDEBAR: Optics & Camera Controls */}
          <aside className="w-80 border-r border-white/10 bg-[#09090d]/90 backdrop-blur-xl flex flex-col justify-between z-20">
            <div className="p-5 space-y-6 overflow-y-auto">
              
              {/* Brand Header */}
              <div className="flex items-center justify-between pb-4 border-b border-white/10">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-violet-600 via-indigo-500 to-fuchsia-500 p-[1px] shadow-lg shadow-violet-500/20">
                    <div className="w-full h-full bg-zinc-950 rounded-[7px] flex items-center justify-center font-bold text-violet-400">
                      CC
                    </div>
                  </div>
                  <span className="font-bold tracking-tight text-sm">CLIPCRAFT <span className="text-[10px] text-zinc-500 font-mono">v2.4</span></span>
                </div>
                <span className="px-2 py-0.5 text-[10px] font-mono tracking-wider text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 rounded-full">
                  4K READY
                </span>
              </div>

              {/* Camera Optics Rig */}
              <div className="space-y-4">
                <span className="text-[10px] font-mono uppercase tracking-widest text-zinc-500">Camera Rig Parameters</span>

                {/* Lens */}
                <div className="space-y-1.5">
                  <label className="text-xs text-zinc-400 font-medium">Focal Optics</label>
                  <select 
                    value={lens}
                    onChange={(e) => setLens(e.target.value)}
                    className="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-zinc-200 focus:outline-none focus:border-violet-500"
                  >
                    <option>24mm Ultra-Wide</option>
                    <option>35mm Anamorphic</option>
                    <option>50mm Prime Cinematic</option>
                    <option>85mm Portrait Macro</option>
                  </select>
                </div>

                {/* Atmosphere */}
                <div className="space-y-1.5">
                  <label className="text-xs text-zinc-400 font-medium">Atmosphere & Lighting</label>
                  <select 
                    value={lighting}
                    onChange={(e) => setLighting(e.target.value)}
                    className="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-zinc-200 focus:outline-none focus:border-violet-500"
                  >
                    <option>Golden Hour Raytracing</option>
                    <option>Volumetric Fog & Cyan Glow</option>
                    <option>Noir High-Contrast Studio</option>
                    <option>Moody Overcast Natural</option>
                  </select>
                </div>

                {/* Duration & Resolution */}
                <div className="grid grid-cols-2 gap-2">
                  <div className="space-y-1">
                    <label className="text-[11px] text-zinc-400">Duration</label>
                    <select 
                      value={duration} 
                      onChange={(e) => setDuration(e.target.value)}
                      className="w-full bg-zinc-900 border border-white/10 rounded-lg px-2.5 py-1.5 text-xs text-zinc-200"
                    >
                      <option value="2">2s</option>
                      <option value="5">5s</option>
                      <option value="10">10s</option>
                      <option value="15">15s</option>
                    </select>
                  </div>
                  <div className="space-y-1">
                    <label className="text-[11px] text-zinc-400">Resolution</label>
                    <select 
                      value={resolution} 
                      onChange={(e) => setResolution(e.target.value)}
                      className="w-full bg-zinc-900 border border-white/10 rounded-lg px-2.5 py-1.5 text-xs text-zinc-200"
                    >
                      <option value="1280x720">720p HD</option>
                      <option value="1920x1080">1080p FHD</option>
                      <option value="3840x2160">4K UHD</option>
                    </select>
                  </div>
                </div>

                {/* Velocity */}
                <div className="space-y-1.5 pt-2">
                  <div className="flex justify-between text-xs">
                    <span className="text-zinc-400">Camera Velocity</span>
                    <span className="font-mono text-violet-400">{velocity}%</span>
                  </div>
                  <input 
                    type="range" min="0" max="100" value={velocity}
                    onChange={(e) => setVelocity(e.target.value)}
                    className="w-full h-1 bg-zinc-800 rounded-lg appearance-none accent-violet-500 cursor-pointer"
                  />
                </div>
              </div>

            </div>

            {/* Account Footer */}
            <div className="p-4 border-t border-white/10 bg-zinc-950/50 flex items-center justify-between">
              <div>
                <div className="text-xs font-semibold text-zinc-200">Director Tier</div>
                <div className="text-[10px] font-mono text-zinc-500">1,850 Credits</div>
              </div>
              <span className="px-2.5 py-1 bg-violet-600/20 text-violet-300 border border-violet-500/30 rounded-lg text-xs font-medium">
                PRO ACTIVE
              </span>
            </div>
          </aside>

          {/* MAIN VIEWPORT AREA */}
          <main className="flex-1 flex flex-col justify-between relative bg-[#050507]">
            
            {/* Header Toolbar */}
            <header className="h-14 border-b border-white/10 px-6 flex items-center justify-between bg-zinc-950/40 backdrop-blur-md">
              <div className="flex items-center gap-3">
                <span className="text-xs font-medium text-zinc-300">{activeShot.title}</span>
                <span className="text-[10px] font-mono px-2 py-0.5 bg-zinc-900 border border-white/10 rounded text-zinc-400">
                  {activeShot.ratio}
                </span>
              </div>
              <div className="text-xs font-mono text-zinc-500">
                ENGINE: FASTAPI + RUNWAY ML
              </div>
            </header>

            {/* Display Viewport */}
            <section className="flex-1 p-6 flex items-center justify-center relative">
              <div className="relative w-full max-w-5xl aspect-video rounded-2xl overflow-hidden border border-white/10 bg-zinc-950 shadow-2xl group flex items-center justify-center">
                
                {renderResult ? (
                  renderResult.endsWith('.svg') ? (
                    <object data={renderResult} type="image/svg+xml" className="w-full h-full object-contain" />
                  ) : (
                    <video src={renderResult} controls autoPlay loop className="w-full h-full object-cover" />
                  )
                ) : isRendering ? (
                  <div className="flex flex-col items-center gap-4 p-8 text-center max-w-md">
                    <div className="w-12 h-12 border-4 border-violet-500/20 border-t-violet-500 rounded-full animate-spin" />
                    <div>
                      <p className="text-sm font-semibold text-zinc-200 capitalize">{stage}</p>
                      <p className="text-xs text-zinc-500 font-mono mt-1">{progress}% Rendered</p>
                    </div>
                    <div className="w-full bg-zinc-900 h-1.5 rounded-full overflow-hidden border border-white/10">
                      <div className="bg-gradient-to-r from-violet-500 to-indigo-500 h-full transition-all duration-300" style={{ width: `${progress}%` }} />
                    </div>
                  </div>
                ) : (
                  <>
                    <img src={activeShot.img} alt="Preview" className="w-full h-full object-cover" />
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/20" />
                    <div className="absolute top-4 left-4 flex items-center gap-2">
                      <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                      <span className="text-[11px] font-mono text-zinc-300 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-md border border-white/10">
                        CANVAS PREVIEW &middot; 24 FPS
                      </span>
                    </div>
                  </>
                )}

                {error && (
                  <div className="absolute bottom-4 left-4 right-4 p-3.5 bg-red-950/80 border border-red-500/40 text-red-300 text-xs rounded-xl backdrop-blur-md shadow-xl">
                    <strong className="font-semibold block mb-0.5">Execution Exception:</strong>
                    {error}
                  </div>
                )}
              </div>
            </section>

            {/* Timeline Bar */}
            <section className="h-40 border-t border-white/10 bg-zinc-950/90 p-4 flex flex-col justify-between">
              <div className="flex items-center justify-between text-xs font-mono text-zinc-400 px-2">
                <span>SEQUENCE TIMELINE</span>
                <span>00:00:05</span>
              </div>

              <div className="flex gap-3 overflow-x-auto py-1">
                {ASSET_GALLERY.map((shot) => (
                  <div 
                    key={shot.id}
                    onClick={() => { setActiveShot(shot); setRenderResult(null); setError(null); }}
                    className={`h-20 min-w-[150px] rounded-xl overflow-hidden border relative cursor-pointer transition-all ${
                      activeShot.id === shot.id 
                        ? 'border-violet-500 ring-2 ring-violet-500/30' 
                        : 'border-white/10 opacity-50 hover:opacity-100'
                    }`}
                  >
                    <img src={shot.img} className="w-full h-full object-cover" />
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent p-2 flex flex-col justify-end">
                      <span className="text-[10px] font-medium text-zinc-200 truncate">{shot.title}</span>
                    </div>
                  </div>
                ))}
              </div>
            </section>

          </main>

          {/* RIGHT SIDEBAR: Scene Direction */}
          <aside className="w-80 border-l border-white/10 bg-[#09090d]/90 backdrop-blur-xl p-5 flex flex-col justify-between z-20">
            <div className="space-y-5">
              <span className="text-[10px] font-mono uppercase tracking-widest text-zinc-500">Shot Composition</span>

              <div className="space-y-2">
                <label className="text-xs text-zinc-400 font-medium">Prompt Direction</label>
                <textarea 
                  rows={5}
                  value={prompt}
                  onChange={(e) => setPrompt(e.target.value)}
                  className="w-full bg-zinc-900 border border-white/10 rounded-xl p-3 text-xs text-zinc-200 focus:outline-none focus:border-violet-500 leading-relaxed resize-none"
                />
              </div>

              {/* 3D Motion Grid */}
              <div className="space-y-2">
                <span className="text-[11px] font-mono text-zinc-400">Vector Direction</span>
                <div className="grid grid-cols-3 gap-1.5">
                  {['Pan L', 'Tilt Up', 'Pan R', 'Zoom In', 'Track', 'Zoom Out', 'Roll L', 'Tilt Down', 'Roll R'].map((dir, i) => (
                    <button key={dir} className={`py-2 text-[10px] font-mono rounded-lg border text-center ${i === 3 ? 'bg-violet-600/20 border-violet-500/40 text-violet-300' : 'bg-zinc-900 border-white/10 text-zinc-400'}`}>
                      {dir}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <button 
              onClick={handleRender}
              disabled={isRendering}
              className="w-full py-3.5 bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-semibold text-xs rounded-xl shadow-lg shadow-violet-600/25 border border-white/10 transition-all disabled:opacity-50"
            >
              {isRendering ? 'Rendering Scene...' : 'Render Video Scene'}
            </button>
          </aside>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StudioApp />);
  </script>
</body>
</html>
