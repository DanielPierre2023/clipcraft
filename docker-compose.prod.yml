version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clipcraft
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: production_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:production_password@postgres:5432/clipcraft
      DATABASE_URL_SYNC: postgresql://postgres:production_password@postgres:5432/clipcraft
      REDIS_URL: redis://redis:6379/0
      CLERK_JWKS_URL: ${CLERK_JWKS_URL}
      RUNWAY_API_KEY: ${RUNWAY_API_KEY}
      REPLICATE_API_KEY: ${REPLICATE_API_KEY}
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  celery_worker:
    build:
      context: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=info -c 4
    environment:
      DATABASE_URL_SYNC: postgresql://postgres:production_password@postgres:5432/clipcraft
      REDIS_URL: redis://redis:6379/0
      RUNWAY_API_KEY: ${RUNWAY_API_KEY}
      REPLICATE_API_KEY: ${REPLICATE_API_KEY}
    depends_on:
      - redis
      - postgres

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}

volumes:
  pgdata:
