apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clipcraft-ingress
  namespace: clipcraft
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
  - hosts:
    - app.clipcraft.ai
    secretName: clipcraft-tls
  rules:
  - host: app.clipcraft.ai
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000
