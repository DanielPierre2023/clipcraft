apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: clipcraft
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
      - name: api
        image: registry.clipcraft.ai/backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: clipcraft-config
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: clipcraft
spec:
  replicas: 5
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: worker
        image: registry.clipcraft.ai/backend:latest
        command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info"]
        envFrom:
        - configMapRef:
            name: clipcraft-config
